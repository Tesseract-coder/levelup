name: Deploy to Cloudflare Pages

# Manual only: run from the Actions tab → "Deploy to Cloudflare Pages" → Run workflow.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: levelup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Creates the Pages project on the first run; harmless if it already exists.
      - run: npx wrangler@3 pages project create "$PROJECT_NAME" --production-branch main || true
      - run: npx wrangler@3 pages deploy dist --project-name "$PROJECT_NAME" --branch main
